<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warnings Log</title>
    <link rel="stylesheet" href="records/records.css" />
    <script src="records/theme-init.js"></script>
    <style>
      .badge-warning {
        background-color: #fff3cd !important;
        color: #856404 !important;
        border: 1px solid #ffeeba !important;
      }
      .badge-error {
        background-color: #f8d7da !important;
        color: #721c24 !important;
        border: 1px solid #f5c6cb !important;
      }
      .badge-info {
        background-color: #d1ecf1 !important;
        color: #0c5460 !important;
        border: 1px solid #bee5eb !important;
      }
      html.dark-mode .badge-warning {
        background-color: #664d03 !important;
        color: #ffda6a !important;
        border: 1px solid #4d3a02 !important;
      }
      html.dark-mode .badge-error {
        background-color: #58151c !important;
        color: #ea868f !important;
        border: 1px solid #410f14 !important;
      }
      html.dark-mode .badge-info {
        background-color: #0c363c !important;
        color: #8be0ee !important;
        border: 1px solid #082529 !important;
      }
      .type-badge {
        font-weight: 600 !important;
        text-transform: uppercase !important;
        padding: 4px 8px !important;
      }
    </style>
  </head>
  <body class="warnings-page">
    <div class="shell">
      <aside class="rail">
        <div class="rail-logo" aria-hidden="true">CT</div>
        <button class="tab rail-btn" data-tab="recordsTab" data-href="records.html" aria-label="Records">
          <svg style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <line x1="10" y1="9" x2="8" y2="9" />
          </svg>
        </button>
        <button class="tab rail-btn active" data-tab="warningsTab" data-href="warnings.html" aria-label="Warnings">
          <svg style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
        </button>
        <button class="tab rail-btn" data-tab="shiftsTab" data-href="shifts.html" aria-label="Shifts">
          <svg style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
        </button>
        <button class="tab rail-btn rail-btn-account" data-tab="accountTab" data-href="account.html" aria-label="Account">
          <svg style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </button>
        <button class="tab rail-btn" data-tab="settingsTab" data-href="settings.html" aria-label="Settings">
          <svg style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </aside>
      <div class="page">
        <div class="app">
          <header>
            <h1>Warnings & Errors Log</h1>
            <div class="header-right">
              <div id="warningCount" class="muted">0 logs</div>
              <div class="month-nav">
                <button id="prevMonth" class="nav-btn">◀</button>
                <span id="currentMonthLabel"></span>
                <button id="nextMonth" class="nav-btn">▶</button>
              </div>
              <div class="header-actions">
                <button id="clearWarnings" class="btn ghost">Clear Logs</button>
              </div>
            </div>
          </header>

          <div class="tab-panels">
            <section id="warningsTab" class="panel active records-layout" style="grid-template-columns: 1fr;">
              <section class="main">
                <div class="records-list">
                  <div id="warningsLoading" class="empty">Loading logs...</div>
                  <div id="warningsEmpty" class="empty" style="display: none;">No warnings or errors logged yet.</div>
                  <div id="warningsContainer" class="records"></div>
                </div>
              </section>
            </section>
          </div>
        </div>
      </div>
    </div>

    <script src="records/warnings.js"></script>
  </body>
</html>
