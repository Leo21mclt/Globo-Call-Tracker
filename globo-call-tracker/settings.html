<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings</title>
    <link rel="stylesheet" href="records/records.css" /></head>
  <body class="settings-page">
    <div class="shell">
      <aside class="rail">
        <div class="rail-logo" aria-hidden="true">CT</div>
        <button class="tab rail-btn" data-tab="recordsTab" data-href="records.html" aria-label="Records">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm8 1.5V9h4.5" />
          </svg>
        </button>
        <button class="tab rail-btn active" data-tab="settingsTab" data-href="settings.html" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.4 13.5a7.7 7.7 0 0 0 .1-1.5 7.7 7.7 0 0 0-.1-1.5l2.1-1.6a.8.8 0 0 0 .2-1l-2-3.5a.8.8 0 0 0-1-.3l-2.5 1a7.2 7.2 0 0 0-2.6-1.5l-.4-2.7A.8.8 0 0 0 12.4 1h-4a.8.8 0 0 0-.8.7l-.4 2.7a7.2 7.2 0 0 0-2.6 1.5l-2.5-1a.8.8 0 0 0-1 .3l-2 3.5a.8.8 0 0 0 .2 1l2.1 1.6a7.7 7.7 0 0 0-.1 1.5c0 .5 0 1 .1 1.5l-2.1 1.6a.8.8 0 0 0-.2 1l2 3.5a.8.8 0 0 0 1 .3l2.5-1a7.2 7.2 0 0 0 2.6 1.5l.4 2.7a.8.8 0 0 0 .8.7h4a.8.8 0 0 0 .8-.7l.4-2.7a7.2 7.2 0 0 0 2.6-1.5l2.5 1a.8.8 0 0 0 1-.3l2-3.5a.8.8 0 0 0-.2-1zM10.4 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" />
          </svg>
        </button>
        <button class="tab rail-btn" data-tab="shiftsTab" data-href="shifts.html" aria-label="Shifts">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1zm12 8H5v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8z" />
          </svg>
        </button>
      </aside>
      <div class="page">
        <div class="app">
      <header>
        <h1>Settings</h1>

      </header>

      <div class="tab-panels">


        <section id="settingsTab" class="panel active">
          <div class="card settings-card">
            <h2>Settings</h2>
            <div class="form-row">
              <label>Retention days</label>
              <input id="retentionDays" type="number" min="1" />
            </div>
            <div class="form-row">
              <label>Rate per billable minute (audio)</label>
              <input id="ratePerMinuteAudio" type="number" min="0" step="0.01" />
            </div>
            <div class="form-row">
              <label>Rate per billable minute (video)</label>
              <input id="ratePerMinuteVideo" type="number" min="0" step="0.01" />
            </div>
            <div class="form-row">
              <label>Default shift hourly rate</label>
              <input id="shiftHourlyRate" type="number" min="0" step="0.01" />
            </div>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border-color);"/>
            <h2>Appearance</h2>
            <div class="form-row" style="align-items: center; gap: 10px; justify-content: flex-start;">
              <label for="darkMode">Dark Mode</label>
              <label class="toggle-switch">
                <input id="darkMode" type="checkbox" />
                <span class="toggle-slider"></span>
              </label>
            </div>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border-color);"/>
            <h2>Auto-Answer</h2>
            <div class="form-row" style="align-items: center; gap: 10px; justify-content: flex-start;">
              <label for="autoAnswerEnabled">Enable Auto-Answer</label>
              <label class="toggle-switch">
                <input id="autoAnswerEnabled" type="checkbox" />
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div class="form-row">
              <label>Delay before answering (seconds)</label>
              <input id="autoAnswerDelaySeconds" type="number" min="0" />
            </div>
            <div class="form-actions">
              <button id="saveSettings">Save settings</button>
              <button id="resetSettings">Reset</button>
            </div>
          </div>
        </section>


      </div>
        </div>
      </div>
    </div>

    <script src="records/records.js"></script>
  </body>
</html>
