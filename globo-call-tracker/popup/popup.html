<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Call Tracker</title>
    <link rel="stylesheet" href="popup.css" /></head>
  <body>
    <div class="app">
      <div id="mainView" class="view">
        <header>
          <h1>Call Tracker</h1>
          <div class="header-actions">
            <button id="settingsToggle" class="icon-btn" aria-label="Settings">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M19.4 13.5a7.7 7.7 0 0 0 .1-1.5 7.7 7.7 0 0 0-.1-1.5l2.1-1.6a.8.8 0 0 0 .2-1l-2-3.5a.8.8 0 0 0-1-.3l-2.5 1a7.2 7.2 0 0 0-2.6-1.5l-.4-2.7A.8.8 0 0 0 12.4 1h-4a.8.8 0 0 0-.8.7l-.4 2.7a7.2 7.2 0 0 0-2.6 1.5l-2.5-1a.8.8 0 0 0-1 .3l-2 3.5a.8.8 0 0 0 .2 1l2.1 1.6a7.7 7.7 0 0 0-.1 1.5c0 .5 0 1 .1 1.5l-2.1 1.6a.8.8 0 0 0-.2 1l2 3.5a.8.8 0 0 0 1 .3l2.5-1a7.2 7.2 0 0 0 2.6 1.5l.4 2.7a.8.8 0 0 0 .8.7h4a.8.8 0 0 0 .8-.7l.4-2.7a7.2 7.2 0 0 0 2.6-1.5l2.5 1a.8.8 0 0 0 1-.3l2-3.5a.8.8 0 0 0-.2-1zM10.4 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
                />
              </svg>
            </button>
            <span id="statusBadge" class="badge idle">Idle</span>
          </div>
        </header>

        <section class="active">
          <div class="row">
            <div class="label">Client</div>
            <div id="activeClient" class="value">-</div>
          </div>
          <div class="row">
            <div class="label">Call ID</div>
            <div id="activeCallId" class="value">-</div>
          </div>
          <div class="row">
            <div class="label">Start</div>
            <div id="activeStart" class="value">-</div>
          </div>
          <div class="row">
            <div class="label">Elapsed</div>
            <div id="activeElapsed" class="value">00:00:00</div>
          </div>
          <div class="row">
            <div class="label">Billable</div>
            <div id="activeBillable" class="value">0 min</div>
          </div>
        </section>

        <section class="actions">
          <button id="shiftToggleBtn" class="btn wide">Start Shift</button>
        </section>

        <section class="logs">
          <div class="logs-header">
            <h2>Recent Calls</h2>
            <button id="openAllRecords" class="btn ghost small">All Records</button>
          </div>
          <div id="logsEmpty" class="empty">No calls logged yet.</div>
          <div id="logsScroll" class="logs-scroll">
            <table id="logsTable">
              <thead>
                <tr>
                  <th>Start</th>
                  <th>Type</th>
                  <th>Call ID</th>
                  <th>Client</th>
                  <th>Billable</th>
                </tr>
              </thead>
              <tbody id="logsBody"></tbody>
            </table>
          </div>
        </section>

        <footer>
          <div id="lastUpdated" class="muted">Last updated: -</div>
        </footer>
      </div>

    </div>

    <script src="popup.js"></script>
  </body>
</html>
