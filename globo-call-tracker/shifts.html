<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shifts</title>
    <link rel="stylesheet" href="records/records.css" /></head>
  <body class="shifts-page">
    <div class="shell">
      <aside class="rail">
        <div class="rail-logo" aria-hidden="true">CT</div>
        <button class="tab rail-btn" data-tab="recordsTab" data-href="records.html" aria-label="Records">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm8 1.5V9h4.5" />
          </svg>
        </button>
        <button class="tab rail-btn" data-tab="settingsTab" data-href="settings.html" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.4 13.5a7.7 7.7 0 0 0 .1-1.5 7.7 7.7 0 0 0-.1-1.5l2.1-1.6a.8.8 0 0 0 .2-1l-2-3.5a.8.8 0 0 0-1-.3l-2.5 1a7.2 7.2 0 0 0-2.6-1.5l-.4-2.7A.8.8 0 0 0 12.4 1h-4a.8.8 0 0 0-.8.7l-.4 2.7a7.2 7.7 0 0 0-2.6 1.5l-2.5-1a.8.8 0 0 0-1 .3l-2 3.5a.8.8 0 0 0 .2 1l2.1 1.6a7.7 7.7 0 0 0-.1 1.5c0 .5 0 1 .1 1.5l-2.1 1.6a.8.8 0 0 0-.2 1l2 3.5a.8.8 0 0 0 1 .3l2.5-1a7.2 7.2 0 0 0 2.6 1.5l.4 2.7a.8.8 0 0 0 .8.7h4a.8.8 0 0 0 .8-.7l.4-2.7a7.2 7.2 0 0 0 2.6-1.5l2.5 1a.8.8 0 0 0 1-.3l2-3.5a.8.8 0 0 0-.2-1zM10.4 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" />
          </svg>
        </button>
        <button class="tab rail-btn active" data-tab="shiftsTab" data-href="shifts.html" aria-label="Shifts">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1zm12 8H5v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8z" />
          </svg>
        </button>
      </aside>
      <div class="page">
        <div class="app">
      <header>
        <h1>Shifts</h1>
      </header>

      <div class="tab-panels">


        <section id="shiftsTab" class="panel active">
          <div class="card weekly-card">
            <div class="week-header">
              <h2>Weekly Shifts</h2>
              <div class="week-nav">
                <button id="prevWeek" class="nav-btn">◀</button>
                <span id="currentWeekLabel"></span>
                <button id="nextWeek" class="nav-btn">▶</button>
                <button id="thisWeek" class="nav-btn">This Week</button>
                <button id="syncDeputyBtn" class="btn" style="padding: 6px 12px; margin-left: 8px;">Sync Deputy</button>
              </div>
            </div>
            <div id="weeklyGrid" class="week-grid"></div>
            <div class="form-actions">
              <button id="saveWeekly">Save Week</button>
            </div>
          </div>
          <div class="card shifts-card">
            <h2>Shifts</h2>
            <div id="shiftsList"></div>
          </div>
        </section>
      </div>
      
      <!-- Sync Preview Modal -->
      <div id="syncPreviewModal" class="modal-overlay hidden">
        <div class="modal-card">
          <h2>Deputy Sync Preview</h2>
          <p class="muted">Review the shifts imported from Deputy. You can edit them below.</p>
          <div id="syncPreviewContent" class="sync-preview-content"></div>
          <div class="form-actions">
            <button id="cancelSync" class="btn ghost">Cancel</button>
            <button id="approveSync" class="btn">Approve & Save</button>
          </div>
        </div>
      </div>
      <!-- Edit Shift Modal -->
      <div id="editShiftModal" class="modal-overlay hidden">
        <div class="modal-card" style="max-width: 400px;">
          <h2>Edit Shift</h2>
          <div class="form-row" style="margin-top: 16px;">
            <label>Date</label>
            <input type="text" id="editShiftDate" disabled style="background: #f4efe6;" />
          </div>
          <div class="form-row">
            <label>Start Time</label>
            <input type="time" id="editShiftStart" disabled />
          </div>
          <div class="form-row">
            <label>End Time</label>
            <input type="time" id="editShiftEnd" disabled />
          </div>
          <div class="form-actions" style="margin-top: 24px; justify-content: space-between;">
            <button id="editShiftDelete" class="btn ghost" style="color: #d32f2f; border-color: #f8bbd0;">Delete</button>
            <div style="display: flex; gap: 8px;">
              <button id="editShiftCancel" class="btn ghost">Cancel</button>
              <button id="editShiftToggle" class="btn">Edit</button>
            </div>
          </div>
        </div>
      </div>
      
        </div>
      </div>
    </div>

    <script src="records/records.js"></script>
  </body>
</html>
